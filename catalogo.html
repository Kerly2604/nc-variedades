
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Catálogo | NC Variedades</title>
    <meta name="description" content="Explorá los productos disponibles en NC Variedades.">

    <link rel="stylesheet" href="styles.css">

    <!-- Inventario y funcionamiento del catálogo -->
    <script src="products.js" defer></script>
    <script src="app.js" defer></script>
</head>
<body>

    <!-- ENCABEZADO -->
    <header class="header">
        <div class="container">

<span class="logo">
    <img src="logo/oficial.png"
         alt="Logo de NC Variedades"
         class="logo-image"
         onclick="abrirLogo()">
    <span>NC VARIEDADES</span>
</span>


            <nav class="navigation">
                <a href="index.html">
                    <span class="nav-icon">⌂</span>
                    Inicio
                </a>

               
<a href="catalogo.html" aria-current="page">
    <span class="nav-icon">🛍️</span>
    Catálogo
</a>


                <a href="nosotros.html">
                    <span class="nav-icon">ⓘ</span>
                    Nosotros
                </a>

                <a href="contacto.html">
                    <span class="nav-icon">✉</span>
                    Contacto
                </a>
            </nav>

        </div>
    </header>

    <!-- CATÁLOGO -->
    <main>
        <section class="catalog-section">
            <div class="container">

                <h1>Nuestro catálogo</h1>

                <p class="section-description">
                    Encontrá productos para tu estilo,
                    consultá tallas y disponibilidad.
                </p>

                <!-- CATEGORÍAS GENERADAS AUTOMÁTICAMENTE -->
                <div
                    id="categories"
                    class="categories"
                    aria-label="Filtrar productos por categoría"
                >
                    <!-- app.js generará los botones aquí -->
                </div>

                <!-- PRODUCTOS DEL INVENTARIO -->
                <div
                    id="product-list"
                    class="product-grid"
                    aria-live="polite"
                >
                    <!-- app.js mostrará los productos aquí -->
                </div>

                <!-- MENSAJE CUANDO NO HAY PRODUCTOS -->
                <p id="empty-message" hidden>
                    No hay productos disponibles en esta categoría.
                </p>

            </div>
        </section>
    </main>


    <!-- PIE DE PÁGINA -->
    <footer class="footer">
        <div class="container">
            <p>
                &copy; <span id="current-year"></span>
                NC VARIEDADES. Todos los derechos reservados.
            </p>
        </div>
    </footer>

    <!-- AÑO AUTOMÁTICO -->
    <script>
        document.getElementById("current-year").textContent =
            new Date().getFullYear();
    </script>

    <!-- VISOR DEL LOGO EN GRANDE -->
    <div id="visorLogo" class="visor-logo" onclick="cerrarLogo()">
        <span class="cerrar-logo">&times;</span>
        <img src="logo/oficial.png" alt="Logo de NC Variedades ampliado">
    </div>

    <script>
        function abrirLogo() {
            document.getElementById("visorLogo").style.display = "flex";
        }

        function cerrarLogo() {
            document.getElementById("visorLogo").style.display = "none";
        }
    </script>

</body>
</html>
