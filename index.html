<span class="logo">

</span>


            <nav class="navigation">

  <script>
    window.abrirLogo = function () {
        document.getElementById("visorLogo").style.display = "flex";

    window.cerrarLogo = function () {
        document.getElementById("visorLogo").style.display = "none";
